<title>מלאי מומנט</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: phone-first tool. Header, one working view at a time, bottom tab bar (sell / receive / stock / report).
   Palette matches the owner's questionnaire: lilac-grey paper, ink-navy text, one indigo accent; semantic green/amber/red only for stock state. */
:root{
  direction:rtl;
  --bg:#F1F1F6; --surface:#FFFFFF; --fg:#1C1B2B; --muted:#5B5B70; --line:#D6D6E2;
  --accent:#3B3FA0; --accent-fg:#FFFFFF; --accent-soft:#E5E6F7;
  --ok:#1F6B47; --ok-soft:#DDF0E6; --warn:#8A5300; --warn-soft:#FBEBD0; --crit:#A3211B; --crit-soft:#FAE0DE;
  --font-display:"Frank Ruhl Libre",Georgia,serif;
  --font-body:"Heebo","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131320; --surface:#1C1C2E; --fg:#E9E9F3; --muted:#A3A3BC; --line:#30304A;
    --accent:#9EA3F5; --accent-fg:#101128; --accent-soft:#2A2B4D;
    --ok:#7CC4A0; --ok-soft:#1B3328; --warn:#E8B45F; --warn-soft:#3A2D14; --crit:#F09A94; --crit-soft:#3C1E1D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131320; --surface:#1C1C2E; --fg:#E9E9F3; --muted:#A3A3BC; --line:#30304A;
  --accent:#9EA3F5; --accent-fg:#101128; --accent-soft:#2A2B4D;
  --ok:#7CC4A0; --ok-soft:#1B3328; --warn:#E8B45F; --warn-soft:#3A2D14; --crit:#F09A94; --crit-soft:#3C1E1D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.55;
  padding-block:16px calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:640px; margin:0 auto; min-width:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3{margin:0; text-wrap:balance}

/* header */
.top{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:6px}
.top h1{font-family:var(--font-display); font-size:28px; font-weight:700; line-height:1.2}
.badge{font-size:13px; font-weight:700; background:var(--accent-soft); color:var(--accent); padding:2px 10px; border-radius:999px}
.sub{color:var(--muted); font-size:14.5px; margin:0 0 14px}
.linkbtn{background:none; border:0; padding:2px 0; color:var(--muted); font-size:14px; text-decoration:underline}

/* generic */
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; min-width:0}
.sec-title{font-family:var(--font-display); font-size:21px; font-weight:700; margin:18px 0 8px}
.field{display:grid; gap:4px; margin-bottom:10px}
.field label,.lab{font-size:14px; font-weight:700; color:var(--muted)}
input[type=text],input[type=search],input[type=number],select{width:100%; font:inherit; font-size:16px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn{font-weight:700; font-size:16px; padding:12px 18px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-fg)}
.btn.alt{background:transparent; color:var(--accent)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; font-size:15px}
.chip.on{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.pill{display:inline-block; font-size:13px; font-weight:700; border-radius:999px; padding:1px 10px; white-space:nowrap; font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.crit{background:var(--crit-soft); color:var(--crit)}
.pill.plain{background:var(--accent-soft); color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.empty{color:var(--muted); padding:14px 0; text-align:center}
.note{background:var(--accent-soft); border-radius:10px; padding:10px 14px; font-size:14.5px; margin:10px 0}

/* list rows */
.list{display:grid; gap:8px}
.item{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:right; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-width:0}
.item:hover{border-color:var(--accent)}
.item .nm{font-weight:700; overflow-wrap:anywhere}
.item .meta{font-size:13.5px; color:var(--muted)}
.item .end{display:grid; justify-items:end; gap:4px; flex:none}
.recent{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px}
.recent:last-child{border-bottom:0}
.recent .t{min-width:0; overflow-wrap:anywhere}

/* tables */
.scroll{overflow-x:auto; max-width:100%}
table{border-collapse:collapse; width:100%; font-size:15px; font-variant-numeric:tabular-nums}
th{font-size:13px; color:var(--muted); text-align:right; font-weight:700; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:8px; border-bottom:1px solid var(--line); vertical-align:middle}
td.n,th.n{text-align:center}
tfoot td{font-weight:700; border-bottom:0}
.step{display:inline-flex; align-items:center; gap:6px}
.step button{width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:18px; line-height:1}
.xbtn{border:0; background:none; color:var(--muted); font-size:20px; padding:0 6px}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.tile b{display:block; font-family:var(--font-display); font-size:26px; line-height:1.2; font-variant-numeric:tabular-nums}
.tile span{font-size:13px; color:var(--muted)}
details.grp{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:10px}
details.grp>summary{list-style:none; cursor:pointer; padding:12px 14px; display:flex; justify-content:space-between; gap:10px; align-items:center; font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp .inner{padding:0 14px 8px}
.sumrow{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.cnt{width:84px; padding:6px 8px; text-align:center}

/* sheet */
.scrim{position:fixed; inset:0; background:rgba(10,10,25,.5); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--surface); width:100%; max-width:640px; max-height:92%; overflow:auto; border-radius:18px 18px 0 0;
  padding:20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet h2{font-family:var(--font-display); font-size:22px}
.sizebtn{min-width:56px; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:10px 12px; font-size:17px; font-weight:700; position:relative}
.sizebtn .c{position:absolute; top:-8px; inset-inline-start:-6px; background:var(--accent); color:var(--accent-fg); font-size:12px; min-width:20px; height:20px; border-radius:10px; display:grid; place-items:center; padding:0 5px}
.sizebtn.on{border-color:var(--accent); background:var(--accent-soft)}
.chips.sz{direction:ltr; justify-content:flex-end}
.sizebtn{display:grid; justify-items:center; line-height:1.15}
.sizebtn .st{font-size:11px; font-weight:500; color:var(--muted)}
.sizebtn.none{border-style:dashed; color:var(--muted)}
.sizebtn.sm{min-width:46px; padding:6px 10px; font-size:16px}
.sizecol{display:grid; justify-items:center; gap:4px}
.mbtn{border:1px solid var(--line); background:var(--surface); color:var(--fg); width:36px; height:28px; border-radius:8px; font-size:18px; line-height:1; font-weight:700}
.mbtn.ph{visibility:hidden}
.stepper{display:inline-flex; align-items:center; gap:6px}
.stepper .mbtn{width:34px; height:34px}
.stepper b{min-width:22px; text-align:center}
.rline{padding:12px 0; border-bottom:1px solid var(--line)}
.total{display:flex; justify-content:space-between; align-items:baseline; font-size:18px; margin:12px 0}
.total b{font-family:var(--font-display); font-size:26px}

/* tabs + toast */
nav.tabs{position:fixed; inset:auto 0 0; z-index:30; background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
nav.tabs .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
nav.tabs button{border:0; background:none; padding:10px 4px; border-radius:10px; font-size:15px; font-weight:500; color:var(--muted)}
nav.tabs button.on{background:var(--accent-soft); color:var(--accent); font-weight:700}
.toast{position:fixed; z-index:50; inset-inline:16px; bottom:calc(76px + env(safe-area-inset-bottom, 0px)); margin:0 auto; max-width:480px;
  background:var(--fg); color:var(--bg); padding:12px 16px; border-radius:12px; font-size:15px; text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
.nc{display:flex; gap:10px; align-items:center; min-width:0}
.nc>span:last-child{min-width:0; overflow-wrap:anywhere}
.thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; flex:none; background:var(--accent-soft)}
.al{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
.al:last-child{border-bottom:0}
.al .t{min-width:0; overflow-wrap:anywhere}
a.btn{display:inline-block; text-decoration:none; text-align:center}
.btn.mini{padding:6px 14px; font-size:14px}
textarea{width:100%; font:inherit; font-size:16px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; resize:vertical; min-width:0}
</style>

<div class="wrap">
  <header class="top">
    <h1>מלאי מומנט</h1>
    <span class="badge">סקיצה, נתוני דוגמה</span>
  </header>
  <p class="sub">הדגמה של איך תיראה מכירה, קליטה ודוח סוף חודש. המעצבות והמחירים כאן בדויים. <button class="linkbtn" data-a="reset" type="button">איפוס נתוני הדוגמה</button></p>
  <main id="view"></main>
</div>

<script>
// מומנט - ייבוא פתקים ותעודות משלוח מטקסט. עובד בדפדפן וב-node, בלי תלויות.
(function (root) {
  const SIZE_SUFFIX = /\s*[—–\-]\s*(\d{1,2}|XXS|XS|S|M|L|XL|XXL)\s*$/i;
  const num = s => parseFloat(String(s).replace(/[₪,\s]/g, ""));
  const clean = s => String(s).replace(/[‎‏‪-‮]/g, "").replace(/\s+/g, " ").trim();
  const lines = t => String(t).split(/\r?\n/).map(clean).filter(Boolean);

  // "1.9" או "5/9/26" -> {day, month, year|null}
  function parseDate(s) {
    const m = String(s).match(/(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?/);
    if (!m) return null;
    let y = m[3] ? +m[3] : null;
    if (y && y < 100) y += 2000;
    return { day: +m[1], month: +m[2], year: y };
  }

  // פתק מלאי/מכירות בסגנון של בעלת החנות:
  //   סטודיו הדגמה מלאי 1.9
  //   6 אוברול קיצי
  //   מכירות
  //   אוברול דמו חום מידה 1 ו 0
  // כמות יכולה להופיע בכמה צורות בכתב היד: "3 תמר", "תמר 3", "3 x תמר", "תמר x 3", או בלי מספר
  function parseQtyLine(ln) {
    let m;
    if ((m = ln.match(/^(\d+)\s*[xX×*]\s*(\d+)$/))) {
      const a = m[1], b = m[2];
      return a.length < b.length ? { qty: +a, model: b } : { qty: +b, model: a };
    }
    if ((m = ln.match(/^(\d+)\s*[xX×*]\s*(.+)$/))) return { qty: +m[1], model: clean(m[2]) };
    if ((m = ln.match(/^(.+?)\s*[xX×*]\s*(\d+)$/))) return { qty: +m[2], model: clean(m[1]) };
    if ((m = ln.match(/^(\d+)\s+(.+)$/))) return { qty: +m[1], model: clean(m[2]) };
    if ((m = ln.match(/^(.+?)\s+(\d+)$/))) return { qty: +m[2], model: clean(m[1]) };
    return { qty: null, model: ln };
  }

  // opts.missingQty: כמות להניח לשורה בלי מספר (ברירת מחדל 1), או null כדי להשאיר ריקה
  function parseNote(text, opts) {
    const missing = opts && opts.missingQty !== undefined && opts.missingQty !== null ? opts.missingQty : 1, assumed = [];
    const out = { designer: null, date: null, received: [], sold: [], flags: [] };
    let mode = "stock";
    lines(text).forEach((ln, i) => {
      const h = ln.match(/^(.*?)\s*מלאי\s+([\d./]+)$/), h2 = ln.match(/^מלאי\s+(.+?)\s+([\d./]+)$/);
      if (h && i === 0) { out.designer = h[1] || null; out.date = parseDate(h[2]); return; }
      if (h2 && i === 0) { out.designer = h2[1]; out.date = parseDate(h2[2]); return; }
      if (/^(מכירות|מכירה)$/.test(ln)) { mode = "sales"; return; }
      if (/^(החזרות|החזרה)$/.test(ln)) { mode = "returns"; return; }
      if (mode === "stock" || mode === "returns") {
        const q = parseQtyLine(ln), target = mode === "stock" ? out.received : (out.returned = out.returned || []);
        if (q.qty != null) target.push({ model: q.model, qty: q.qty, size: null });
        else if (opts && opts.missingQty === null) target.push({ model: q.model, qty: null, size: null, assumed: false });
        else { target.push({ model: q.model, qty: missing, size: null, assumed: true }); assumed.push(q.model); }
      } else {
        const m = ln.match(/^(.*?)\s+מידה\s+(.+)$/);
        if (m) {
          m[2].split(/\s*(?:ו|,|\/)\s*|\s+ו\s+/).map(clean).filter(Boolean).forEach(sz => out.sold.push({ model: m[1], qty: 1, size: sz }));
        } else {
          out.sold.push({ model: ln, qty: 1, size: null });
          out.flags.push(`מכירה בלי מידה: "${ln}"`);
        }
      }
    });
    if (assumed.length) out.flags.push(`${assumed.length} שורות בלי מספר נספרו כיחידה אחת (צריך אישור): ${assumed.join(", ")}`);
    if (!out.date) out.flags.push("אין תאריך בכותרת");
    else if (!out.date.year) out.flags.push(`התאריך ${out.date.day}.${out.date.month} בלי שנה (מניחים השנה הנוכחית, יום.חודש)`);
    return out;
  }

  // תעודת משלוח מודפסת, כשהטקסט הועתק משורות הטבלה.
  // כל שורה: מספר  שם [— מידה]  כמות  מחיר ליחידה  סה"כ שורה (מופרדים בטאב, |, או 2+ רווחים)
  function parseDeliveryNote(text) {
    const out = { docNo: null, date: null, designer: null, items: [], declared: {}, flags: [] };
    const L = lines(text);
    for (const ln of L) {
      let m;
      if ((m = ln.match(/\b([A-Z]{2,}\d{3,})\b/)) && !out.docNo) out.docNo = m[1];
      if ((m = ln.match(/(\d{1,2}\.\d{1,2}\.\d{4})/)) && !out.date && !/הוקם|הופק/.test(ln)) out.date = parseDate(m[1]);
      if (/סכום לפני מע.?מ/.test(ln)) out.declared.net = num(ln.match(/([\d,]+\.\d{2})/)[1]);
      else if (/^מע.?מ\s/.test(ln)) out.declared.vat = num(ln.match(/([\d,]+\.\d{2})/)[1]);
      else if (/סה.?כ לתשלום/.test(ln)) out.declared.total = num(ln.match(/([\d,]+\.\d{2})/)[1]);
      if (/-\s*[A-Z]{3,}/.test(ln) && !out.designer && !/\d{3,}/.test(ln)) out.designer = ln;
    }
    const rowRe = /^(\d+)\s*[\t|]?\s*(.+?)\s*[\t|]\s*(\d+)\s*[\t|]\s*₪?([\d,.]+)\s*[\t|]\s*₪?([\d,.]+)$|^(\d+)\s+(.+?)\s{2,}(\d+)\s+₪?([\d,.]+)\s+₪?([\d,.]+)$/;
    for (const raw of String(text).split(/\r?\n/)) {
      const ln = raw.replace(/[‎‏‪-‮]/g, "").trim();
      const m = ln.match(rowRe);
      if (!m) continue;
      const g = m[1] ? m.slice(1, 6) : m.slice(6, 11);
      let name = clean(g[1]), size = null;
      const sm = name.match(SIZE_SUFFIX);
      if (sm) { size = sm[1]; name = clean(name.replace(SIZE_SUFFIX, "")); }
      const qty = +g[2], unit = num(g[3]), line = num(g[4]);
      if (Math.abs(qty * unit - line) > 0.02) out.flags.push(`שורה ${g[0]}: כמות×מחיר (${(qty * unit).toFixed(2)}) שונה מסה"כ השורה (${line})`);
      out.items.push({ row: +g[0], model: name, size, qty, unit, line });
    }
    const rows = out.items.map(i => i.row);
    for (let i = 1; i <= Math.max(0, ...rows); i++) if (!rows.includes(i)) out.flags.push(`שורה ${i} חסרה (אולי לא הועתקה)`);
    out.net = +out.items.reduce((s, i) => s + i.line, 0).toFixed(2);
    out.units = out.items.reduce((s, i) => s + i.qty, 0);
    if (out.declared.net != null && Math.abs(out.net - out.declared.net) > 0.02) out.flags.push(`סכום השורות ${out.net} שונה מהסכום בתעודה ${out.declared.net}`);
    if (out.declared.net != null && out.declared.vat != null && Math.abs(out.declared.net * 0.18 - out.declared.vat) > 0.02) out.flags.push("המע\"מ בתעודה לא תואם 18%");
    const withSize = out.items.filter(i => i.size).length;
    out.sizedRows = withSize;
    return out;
  }

  // איחוד שורות זהות (דגם+מידה)
  function merge(items) {
    const map = new Map();
    items.forEach(i => {
      const k = i.model + "|" + (i.size || "");
      const e = map.get(k) || { model: i.model, size: i.size || null, qty: 0 };
      e.qty += i.qty == null ? 0 : i.qty;
      map.set(k, e);
    });
    return [...map.values()];
  }

  // התאמה לשמות קיימים במערכת
  const STOP = new Set(["חולצת", "אוברול", "גולף", "שמלת", "מכנסי"]);
  const toks = s => clean(s).split(" ").filter(Boolean);
  function match(name, catalog) {
    const n = clean(name);
    const exact = catalog.find(c => clean(c) === n);
    if (exact) return { status: "exact", match: exact };
    const t = new Set(toks(n));
    let best = null, bs = 0;
    catalog.forEach(c => {
      const ct = toks(c);
      const inter = ct.filter(x => t.has(x)).length;
      const sc = inter / Math.max(ct.length, t.size);
      if (sc > bs) { bs = sc; best = c; }
    });
    // שם קצר ("אוברול דמו") שמוכל בשם ארוך עם צבע ("אוברול דמו חום")
    const contained = catalog.filter(c => clean(c).startsWith(n + " ") || n.startsWith(clean(c) + " "));
    if (contained.length) return { status: "variants", matches: contained };
    if (bs >= 0.5) return { status: "similar", match: best, score: +bs.toFixed(2) };
    return { status: "new" };
  }

  const api = { parseNote, parseDeliveryNote, merge, match, parseDate };
  if (typeof module !== "undefined") module.exports = api; else root.MomentImport = api;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
document.documentElement.lang = "he";
document.documentElement.dir = "rtl";

function pad(n){ return (n < 10 ? "0" : "") + n; }
function e(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fm(n){ return "₪" + n.toLocaleString("he-IL", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fm0(n){ return "₪" + n.toLocaleString("he-IL", {maximumFractionDigits:0}); }
function tagFor(w, d){ return Math.round(w * desg(d).mult / 10) * 10; }

function desText(p){ var tg = tag(p), pr = parseFloat(S.price) || 0; return desg(p.d).type === "c" ? "למעצבת: " + fm(p.w * pr / tg) + " ליחידה, לפני מע״מ." : ""; }
function discTxt(r){ var x = Math.round((1 - r.amount / (r.sold * r.p.w)) * 100); return x > 0 ? x + "%" : "—"; }
function today(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function desg(id){ return DESIGNERS.filter(function(d){ return d.id === id; })[0]; }
function prod(id){ return P.filter(function(p){ return p.id === id; })[0]; }
function sizeLabel(s){ return s === "" ? "ללא מידה" : s === "OS" ? "מידה אחת" : "מידה " + s; }

function addMove(type, p, delta, date, size, price, ref, tg, cu){
  M.push({id:++mid, type:type, p:p, delta:delta, date:date, size:size || "", price:price || 0, ref:ref || "", tag:tg || 0, cust:cu || ""});
}
function stock(p){ var n = 0; M.forEach(function(m){ if (m.p === p) n += m.delta; }); return n; }

var SIZES = ["XS","S","M","L","XL"], POOL = ["S","M","XS","L"], SZ = ["XS","S","M","L","XL","0","1","2","3","4","5","6","OS",""];
var SCALES = {L:{name:"אותיות (XS עד XL)", sizes:SIZES}, N:{name:"מספרים (0 עד 4)", sizes:["0","1","2","3","4"]}, OS:{name:"מידה אחת (OS)", sizes:["OS"]}};
function sizesOf(d){ return SCALES[desg(d).scale || "L"].sizes; }
function mapSz(d, z){ var sc = desg(d).scale || "L"; if (sc === "OS") return "OS"; if (sc === "N"){ var i = SIZES.indexOf(z); return i < 0 ? z : String(i); } return z; }
function stockSize(p, sz){ var n = 0; M.forEach(function(m){ if (m.p === p && m.size === sz) n += m.delta; }); return n; }
function sizeBreak(pid){
  var out = [];
  SZ.forEach(function(sz){ var n = stockSize(pid, sz); if (n) out.push(sizeLabel(sz) + ": " + n); });
  return out.join(" · ") || "אין במלאי";
}
function addUnits(type, pid, sizes, date, w){
  var cnt = {}; sizes.forEach(function(z){ cnt[z] = (cnt[z] || 0) + 1; });
  Object.keys(cnt).forEach(function(z){ addMove(type, pid, (type === "receive" ? 1 : -1) * cnt[z], date, z, w, ""); });
}
function adjustUnits(pid, diff){
  var d = today();
  if (diff > 0){ addMove("adjust", pid, diff, d, "", 0); return; }
  for (var k = 0; k < -diff; k++){
    var best = stockSize(pid, "") > 0 ? "" : null;
    if (best === null){ var bn = 0; best = ""; SZ.slice(0, -1).forEach(function(z){ var n = stockSize(pid, z); if (n > bn){ bn = n; best = z; } }); }
    addMove("adjust", pid, -1, d, best, 0);
  }
}
function seed(){
  P = []; M = []; mid = 0;
  SEED.forEach(function(r, i){
    var id = "p" + i, units = [], need = {}, fill = [];
    P.push({id:id, d:r[0], name:r[1], w:r[2]});
    r[5].forEach(function(x){ need[x[1]] = 1; units.push(x[1]); });
    var keys = Object.keys(need), one = keys.length > 0 && keys.every(function(k){ return k === ""; });
    for (var j = 0; units.length + fill.length < r[3]; j++) fill.push(one ? "" : POOL[j % POOL.length]);
    var mp = function(z){ return mapSz(r[0], z); };
    addUnits("receive", id, units.concat(fill).map(mp), "2026-09-15", r[2]);
    if (r[4]) addUnits("receive", id, POOL.slice(0, r[4]).map(mp), "2026-10-17", r[2]);
    r[5].forEach(function(x){ var tg = tagFor(r[2], r[0]); addMove("sale", id, -1, "2026-10-" + pad(x[0]), mp(x[1]), Math.round(tg * (1 - (x[2] || 0) / 100)), "", tg); });
    if (r[6]) addUnits("return", id, fill.slice(0, r[6]).map(mp), "2026-10-12", r[2]);
  });
}

function stockPill(n){
  if (n <= 0) return '<span class="pill crit">אזל</span>';
  if (n <= 2) return '<span class="pill warn">נשארו ' + n + '</span>';
  return '<span class="pill ok">במלאי ' + n + '</span>';
}

function lineAssigned(l){ var n = 0; Object.keys(l.sizes).forEach(function(k){ n += l.sizes[k]; }); return n; }
function loadSample(){
  var ps = P.filter(function(p){ return p.d === S.rd; }).slice(0, 3);
  S.rl = ps.map(function(p, i){ return {name:p.name, qty:i === 1 ? 2 : 1, w:p.w, sizes:{}}; });
  var avg = ps.length ? ps[0].w : 150;
  S.rl.push({name:SAMPLE_NEW[S.rd] || "דגם חדש", qty:1, w:avg, sizes:{}});
  S.docNo = "WH" + (1060 + Math.floor(Math.random() * 30));
  S.docTotal = String(recvSum());
}
function recvSum(){ var t = 0; S.rl.forEach(function(l){ t += l.qty * l.w; }); return Math.round(t * 100) / 100; }
function recvCheck(){
  var sum = recvSum(), dt = parseFloat(S.docTotal);
  if (!S.rl.length) return "";

  return Math.abs(diff) < 0.01 ? '<span class="pill ok">הסכום תואם לתעודה</span>' : '<span class="pill warn">הפרש של ' + fm(Math.abs(diff)) + ' מהתעודה</span>';

function recentReceipts(){
  var seen = {}, rows = [];
  M.slice().reverse().forEach(function(m){ if (!m.batch) return; if (!seen[m.batch]){ seen[m.batch] = {u:0, ref:m.ref}; rows.push(m.batch); } seen[m.batch].u += m.delta; });

/* ---------- month close (count based) ---------- */
function monthEnd(k){ var y = +k.slice(0, 4), mo = +k.slice(5); return k + "-" + pad(new Date(y, mo, 0).getDate()); }
function monthRow(p, month){
  var start = month + "-01", r = {open:0, rec:0, ret:0, sold:0};
  M.forEach(function(m){
    if (m.p !== p.id) return;
    if (m.date < start) r.open += m.delta;
    else if (m.date.slice(0, 7) === month){ if (m.type === "receive") r.rec += m.delta; else if (m.type === "return") r.ret += -m.delta; else if (m.type === "sale") r.sold += -m.delta; }
  });
  return r;
}
function closeInfo(exp, c){
  if (c === "" || c === undefined || isNaN(parseInt(c, 10))) return "";
  var diff = exp - parseInt(c, 10);
  if (diff > 0) return '<span class="pill ok">נמכר עוד ' + diff + '</span>';
  if (diff === 0) return '<span class="pill plain">ללא שינוי</span>';
  return '<span class="pill warn">' + (-diff) + ' יותר מהצפוי</span>';
}
function closeTotals(){
  var d = desg(S.clD), n = 0, all = 0, implied = 0, more = 0, rec = 0;
  P.filter(function(p){ return p.d === d.id; }).forEach(function(p){
    all++; rec += monthRow(p, S.clM).sold;
    var c = S.cc[p.id]; if (c === "" || c === undefined || isNaN(parseInt(c, 10))) return;
    n++; var diff = stock(p.id) - parseInt(c, 10); if (diff > 0) implied += diff; else if (diff < 0) more -= diff;
  });
  return {n:n, all:all, implied:implied, more:more, recorded:rec};
}
function closeSummary(){
  var t = closeTotals();
  return '<div class="card"><div class="total" style="margin:0 0 8px"><span>נספרו ' + t.n + ' מתוך ' + t.all + ' דגמים</span><b>' + (t.recorded + t.implied) + '</b></div>' +
    '<div class="small muted">נמכר החודש עד כה: ' + (t.recorded + t.implied) + ' פריטים (מתועדים ' + t.recorded + ', לפי ספירה ' + t.implied + ').' + (t.more ? ' ב-' + t.more + ' פריטים נספר יותר מהצפוי. כנראה קליטה או החזרה שלא נרשמה.' : '') + '</div>' +
    '<button class="btn full" style="margin-top:10px" type="button" data-a="closeapply"' + (t.n ? "" : " disabled") + '>אישור סגירת חודש</button></div>';
}

  var ps = P.filter(function(p){ return p.d === d.id; });
  var rows = ps.map(function(p){
    var r = monthRow(p, month), exp = stock(p.id), c = S.cc[p.id];
    var sub = 'פתיחה ' + r.open + ' · נקלט ' + r.rec + ' · הוחזר ' + r.ret + (r.sold ? ' · נמכר ' + r.sold : '') + ' · צפוי ' + exp;
    return '<div class="recent">' + nameCell(p, sub) + '<span class="sumrow"><input class="cnt" type="number" inputmode="numeric" min="0" data-cc="' + p.id + '" value="' + (c === undefined ? "" : e(c)) + '" placeholder="' + exp + '" aria-label="ספירה ל' + e(p.name) + '"><span id="cd-' + p.id + '">' + closeInfo(exp, c) + '</span></span></div>';

    '<div class="card"><label class="lab" for="clPaste" style="display:block">הדבקת רשימת ספירה (כמו הפתק של בעלת החנות)</label>' +

    '<div class="row2" style="margin-top:8px"><button class="btn alt" type="button" data-a="clsample">רשימה לדוגמה</button><button class="btn" type="button" data-a="clparse">זיהוי מהרשימה</button></div>' + (S.clMsg || "") + '</div>' +
    '<h2 class="sec-title">ספירה לפי דגם</h2><div class="card">' + (rows || '<div class="empty">אין דגמים למעצבת הזו.</div>') + '</div>' +

function takeSize(pid){
  if (stockSize(pid, "") > 0) return "";
  var best = "", bn = 0; SZ.slice(0, -1).forEach(function(z){ var n = stockSize(pid, z); if (n > bn){ bn = n; best = z; } });
  return best;
}
function closeApply(){
  var d = desg(S.clD), month = S.clM, date = monthEnd(month), sold = 0, extra = 0;
  P.filter(function(p){ return p.d === d.id; }).forEach(function(p){
    var c = S.cc[p.id]; if (c === "" || c === undefined || isNaN(parseInt(c, 10))) return;
    var diff = stock(p.id) - parseInt(c, 10);

    else if (diff < 0){ addMove("adjust", p.id, -diff, date, "", 0); extra -= diff; }
  });
  S.cc = {}; S.clMsg = ""; S.repD = d.id; S.repM = month;
  toast("החודש נסגר ל" + d.name + ". נמכר לפי ספירה: " + sold + (extra ? ". תוקנו " + extra + " פריטים שנספרו מעל הצפוי" : "") + ". התשלום מופיע בדוח מעצבת.");

function clSample(){

function clParse(){

  var tally = {}, un = [], nq = [], asm = [];
  res.received.forEach(function(it){
    if (it.qty == null){ nq.push(it.model); return; }
    if (it.assumed) asm.push(it.model);
    var mt = MomentImport.match(it.model, names);
    if (mt.status === "exact"){ var pr = ps.filter(function(x){ return x.name === mt.match; })[0]; tally[pr.id] = (tally[pr.id] || 0) + it.qty; }
    else if (mt.status === "variants") un.push(it.model + " (במערכת כמה צבעים: " + mt.matches.join(", ") + ")");
    else if (mt.status === "similar") un.push(it.model + " (אולי " + mt.match + "?)");
    else un.push(it.model + " (לא קיים במערכת)");
  });
  Object.keys(tally).forEach(function(id){ S.cc[id] = String(tally[id]); });
  var ok = Object.keys(tally).length, h = '<div class="note" style="margin-top:10px">זוהו ' + ok + ' דגמים וה-ספירה הוזנה למטה.</div>';
  if (un.length) h += '<div class="note" style="background:var(--warn-soft);color:var(--warn)">לא זוהו (מזינים ידנית): ' + un.map(e).join("; ") + '</div>';
  if (asm.length) h += '<div class="note">' + asm.length + ' שורות בלי מספר נספרו כיחידה אחת: ' + asm.map(e).join(", ") + '. אם זה לא נכון, מתקנים ידנית בשדה.</div>';
  if (nq.length) h += '<div class="note" style="background:var(--warn-soft);color:var(--warn)">שורות בלי כמות, ולכן לא הוזנו: ' + nq.map(e).join(", ") + '</div>';
  if (!ok && !un.length && !nq.length) h = '<div class="note" style="margin-top:10px;background:var(--warn-soft);color:var(--warn)">לא נמצאו שורות בפורמט "כמות שם דגם".</div>';
  S.clMsg = h;

/* ---------- alerts ---------- */
function daysSince(d){ return Math.round((Date.now() - new Date(d + "T12:00:00").getTime()) / 864e5); }
function lastRef(pid){ var d = ""; M.forEach(function(m){ if (m.p === pid && (m.type === "sale" || m.type === "receive") && m.date > d) d = m.date; }); return d; }
function stuckList(x){
  return P.filter(function(p){ return stock(p.id) > 0; }).map(function(p){ return {p:p, days:daysSince(lastRef(p.id))}; })
    .filter(function(o){ return o.days >= x; }).sort(function(a, b){ return b.days - a.days; });
}
function sold30(pid){ var n = 0; M.forEach(function(m){ if (m.p === pid && m.type === "sale" && daysSince(m.date) <= 30) n++; }); return n; }
function everSizes(pid){ var o = {}; M.forEach(function(m){ if (m.p === pid && m.type === "receive" && m.size) o[m.size] = 1; }); return Object.keys(o).length; }
function sizeAlerts(){
  var out = [];
  P.forEach(function(p){
    if (stock(p.id) <= 0 || everSizes(p.id) < 2 || stockSize(p.id, "") > 0) return;
    var have = SZ.filter(function(z){ return z !== "" && stockSize(p.id, z) > 0; });
    if (have.length === 1) out.push({p:p, size:have[0], n:stockSize(p.id, have[0])});
  });
  return out;
}
function reorderAlerts(){
  return P.filter(function(p){ return sold30(p.id) >= 2 && stock(p.id) <= 2; }).map(function(p){ return {p:p, sold:sold30(p.id), left:stock(p.id)}; });
}
function nameCell(p, sub){
  return '<span class="t nc">' + (p.img ? '<img class="thumb" src="' + p.img + '" alt="">' : "") + '<span><b>' + e(p.name) + '</b>' + (sub ? '<br><span class="muted small">' + sub + '</span>' : "") + '</span></span>';
}
function readPhoto(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var sc = Math.min(1, 360 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", 0.8));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

    h += '<h3 class="sec-title" style="font-size:18px">זיכוי <span class="pill ' + (b > 0 ? "ok" : "plain") + '">' + fm0(b) + '</span></h3>' +
      CR.filter(function(x){ return x.cust === c.id; }).slice(-3).map(function(x){ return '<div class="recent"><span class="t">' + e(x.note || (x.amount > 0 ? "זיכוי" : "ניצול")) + ' <span class="muted small">· ' + x.date.slice(8) + "." + x.date.slice(5, 7) + '</span></span><b class="num">' + (x.amount > 0 ? "+" : "−") + fm0(Math.abs(x.amount)) + '</b></div>'; }).join("") +
      '<div class="row2" style="margin-top:10px"><div class="field"><label for="crA">סכום</label><input id="crA" type="number" inputmode="decimal" value="' + e(S.crf.amount) + '"></div><div class="field"><label for="crN">הערה</label><input id="crN" type="text" value="' + e(S.crf.note) + '"></div></div>' +
      '<div class="row2"><button class="btn alt" type="button" data-a="cradd">הוספת זיכוי</button><button class="btn alt" type="button" data-a="cruse">ניצול זיכוי</button></div>';
  }
  return h + '</div></div>';
}

/* ---------- shell ---------- */
var TABS = [["home","בית"],["sell","מכירה"],["receive","קליטה"],["stock","מלאי"],["more","עוד"]];
function render(){
  document.getElementById("tabs").innerHTML = TABS.map(function(t){ return '<button type="button" class="' + (S.tab === t[0] ? "on" : "") + '" data-a="tab" data-t="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : "") + '>' + t[1] + '</button>'; }).join("");
  var v = {home:tabHome, sell:tabSell, receive:tabReceive, stock:tabStock, more:tabMore}[S.tab];
  document.getElementById("view").innerHTML = v();
}
var toastTimer;
function toast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 3800);
  render();
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-a]");
  if (!el) return;
  var a = el.getAttribute("data-a");
  if (el.classList.contains("scrim") && ev.target.closest("[data-stop]")) return;
  if (a === "tab"){ S.tab = el.getAttribute("data-t"); S.sheet = null; S.cust = null; renderSheet(); render(); window.scrollTo(0, 0); }
  else if (a === "reset"){ seed(); seedPeople(); S.rl = []; S.counts = {}; S.count = false; S.repM = ""; S.cc = {}; S.clM = ""; S.clMsg = ""; S.clPaste = ""; toast("נתוני הדוגמה אופסו."); }
  else if (a === "chipd"){ S.sd = el.getAttribute("data-d"); render(); }
  else if (a === "open"){ S.cust = null; S.saleCust = ""; S.sheet = el.getAttribute("data-p"); S.units = {}; S.disc = 0; S.price = tag(prod(S.sheet)); renderSheet(); }
  else if (a === "disc"){ S.disc = parseInt(el.getAttribute("data-v"), 10); S.price = Math.round(tag(prod(S.sheet)) * (1 - S.disc / 100)); renderSheet(); }
  else if (a === "closesheet"){ S.sheet = null; renderSheet(); }
  else if (a === "unit"){
    var s = el.getAttribute("data-s"), have = Math.max(0, stockSize(S.sheet, s === "x" ? "" : s));
    if ((S.units[s] || 0) >= have){ toast(have ? "במלאי יש רק " + have + " במידה הזו." : "אין במלאי מהמידה הזו."); return; }
    S.units[s] = (S.units[s] || 0) + 1; renderSheet();
  }
  else if (a === "unitm"){ var s2 = el.getAttribute("data-s"); if (S.units[s2]){ S.units[s2]--; if (!S.units[s2]) delete S.units[s2]; } renderSheet(); }
  else if (a === "clearunits"){ S.units = {}; renderSheet(); }
  else if (a === "sell"){
    var p = prod(S.sheet), price = parseFloat(S.price) || 0, c = 0, bad = null;
    Object.keys(S.units).forEach(function(k){ if (S.units[k] > Math.max(0, stockSize(p.id, k === "x" ? "" : k))) bad = k; });
    if (bad !== null){ toast("הכמות שנבחרה גדולה מהמלאי. עדכני את הבחירה."); renderSheet(); return; }
    Object.keys(S.units).forEach(function(k){ for (var i = 0; i < S.units[k]; i++){ addMove("sale", p.id, -1, today(), k === "x" ? "" : k, price, "", tag(p), S.saleCust); c++; } });
    var who = S.saleCust ? cust(S.saleCust) : null;
    if (who) W.forEach(function(w){ if (w.cust === who.id && w.p === p.id && w.status !== "done") w.status = "done"; });
    S.saleCust = "";
    S.sheet = null; renderSheet();
    toast("נרשם: " + p.name + " ×" + c + ". נשארו " + stock(p.id) + " במלאי." + (who ? " נשמר בכרטיס של " + who.name + "." : ""));
  }
  else if (a === "undo"){ var id = parseInt(el.getAttribute("data-m"), 10); M = M.filter(function(m){ return m.id !== id; }); toast("המכירה בוטלה והמלאי הוחזר."); }
  else if (a === "loadsample"){ loadSample(); render(); }
  else if (a === "lsz"){ var ln = S.rl[+el.getAttribute("data-i")], z = el.getAttribute("data-s"); if (lineAssigned(ln) < ln.qty){ ln.sizes[z] = (ln.sizes[z] || 0) + 1; } render(); }
  else if (a === "lszm"){ var ln2 = S.rl[+el.getAttribute("data-i")], z2 = el.getAttribute("data-s"); if (ln2.sizes[z2]){ ln2.sizes[z2]--; if (!ln2.sizes[z2]) delete ln2.sizes[z2]; } render(); }
  else if (a === "qtyu"){ S.rl[+el.getAttribute("data-i")].qty++; render(); }
  else if (a === "qtyd"){
    var ln3 = S.rl[+el.getAttribute("data-i")];
    if (ln3.qty <= 1){ toast("לפחות יחידה אחת. להסרת השורה לוחצים על ×."); return; }
    ln3.qty--;
    while (lineAssigned(ln3) > ln3.qty){ var ks = Object.keys(ln3.sizes); var kk = ks[ks.length - 1]; ln3.sizes[kk]--; if (!ln3.sizes[kk]) delete ln3.sizes[kk]; }
    render();
  }
  else if (a === "cancelrecv"){
    var b = el.getAttribute("data-b"), mv = M.filter(function(m){ return m.batch === b; }), need = {}, ok = true;
    mv.forEach(function(m){ var k = m.p + "|" + m.size; need[k] = (need[k] || 0) + m.delta; });
    Object.keys(need).forEach(function(k){ var pr = k.split("|"); if (stockSize(pr[0], pr[1]) - need[k] < 0) ok = false; });
    if (!ok){ toast("אי אפשר לבטל: חלק מהפריטים כבר נמכרו. אפשר לתקן בספירה."); return; }
    M = M.filter(function(m){ return m.batch !== b; }); toast("הקליטה בוטלה והמלאי הוחזר."); render();
  }
  else if (a === "lclr"){ S.rl[+el.getAttribute("data-i")].sizes = {}; render(); }
  else if (a === "delline"){ S.rl.splice(+el.getAttribute("data-i"), 1); render(); }
  else if (a === "addline"){
    var nm = S.newName.trim(), w = parseFloat(S.newPrice);
    if (!nm || isNaN(w)){ toast("צריך שם דגם ומחיר כדי להוסיף שורה."); return; }
    S.rl.push({name:nm, qty:1, w:w, sizes:{}}); S.newName = ""; S.newPrice = ""; render();
  }
  else if (a === "confirmrecv"){ confirmRecv(); }
  else if (a === "counttoggle"){ S.count = !S.count; S.counts = {}; render(); }
  else if (a === "countapply"){
    var changed = 0;
    Object.keys(S.counts).forEach(function(id){
      var cv = S.counts[id]; if (cv === "" || cv === undefined) return;
      var diff = parseInt(cv, 10) - stock(id);
      if (diff){ adjustUnits(id, diff); changed++; }
    });
    S.counts = {}; S.count = false;
    toast(changed ? "עודכנו " + changed + " דגמים לפי הספירה." : "הכל תקין, אין הפרשים.");
  }
  else if (a === "sub"){ S.sub = el.getAttribute("data-v"); render(); }
  else if (a === "sview"){ S.stockView = el.getAttribute("data-v"); render(); }
  else if (a === "gostuck"){ S.tab = "stock"; S.stockView = "stuck"; render(); window.scrollTo(0, 0); }
  else if (a === "opencust"){ openCust(el.getAttribute("data-c")); }
  else if (a === "closecust"){ S.cust = null; renderSheet(); }
  else if (a === "csz"){ var zz = el.getAttribute("data-s"), ix = S.cf.sizes.indexOf(zz); if (ix > -1) S.cf.sizes.splice(ix, 1); else S.cf.sizes.push(zz); renderSheet(); }
  else if (a === "csave"){
    var f = S.cf; if (!f.name.trim()){ toast("צריך לכתוב שם."); return; }
    if (S.cust === "new") CU.push({id:"c" + (++cid), name:f.name.trim(), phone:f.phone.trim(), sizes:f.sizes.slice(), note:f.note});
    else { var c0 = cust(S.cust); c0.name = f.name.trim(); c0.phone = f.phone.trim(); c0.sizes = f.sizes.slice(); c0.note = f.note; }
    S.cust = null; renderSheet(); toast("הכרטיס נשמר.");
  }
  else if (a === "wadd"){
    var wf = S.wf; if (!wf.p && !wf.text.trim()){ toast("צריך לבחור דגם או לכתוב תיאור."); return; }
    W.push({id:"w" + (++cid), cust:S.cust, p:wf.p, text:wf.text.trim(), size:wf.size, status:"open", date:today()});
    S.wf = {p:"", size:"", text:""}; renderSheet(); render();
  }
  else if (a === "wdel"){ var wid = el.getAttribute("data-w"); W = W.filter(function(w){ return w.id !== wid; }); renderSheet(); render(); }
  else if (a === "wsent"){ var wid2 = el.getAttribute("data-w"); W.forEach(function(w){ if (w.id === wid2) w.status = "sent"; }); renderSheet(); toast("סומן כנשלח."); }
  else if (a === "cradd" || a === "cruse"){
    var amt = parseFloat(S.crf.amount); if (isNaN(amt) || amt <= 0){ toast("צריך להזין סכום."); return; }
    if (a === "cruse" && amt > balance(S.cust)){ toast("הסכום גדול מהיתרה של הלקוחה."); return; }
    CR.push({id:"r" + (++cid), cust:S.cust, amount:(a === "cruse" ? -amt : amt), note:S.crf.note.trim(), date:today()});
    S.crf = {amount:"", note:""}; renderSheet(); render();
  }
  else if (a === "closeapply"){ closeApply(); render(); }
  else if (a === "clsample"){ S.clPaste = clSample(); S.clMsg = ""; render(); }
  else if (a === "clparse"){ clParse(); render(); }
  else if (a === "adddes"){
    var nm2 = document.getElementById("ndName").value.trim(), ml = parseFloat(document.getElementById("ndMult").value);
    if (!nm2 || isNaN(ml) || ml < 1){ toast("צריך שם ומכפיל (1 ומעלה)."); return; }
    DESIGNERS.push({id:"d" + Date.now(), name:nm2, type:"c", mult:ml, scale:document.getElementById("ndScale").value});
    toast("נוספה: " + nm2 + "."); render();
  }
  else if (a === "copyrep"){
    var text = reportText();
    var done = function(){ toast("הרשימה הועתקה. אפשר להדביק בהודעה למעצבת."); };
    var fail = function(){ toast("ההעתקה לא עבדה כאן. אפשר לסמן את הרשימה בטבלה ולהעתיק ידנית."); };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (err){ fail(); }
  }
});

document.addEventListener("input", function(ev){
  var t = ev.target, id = t.id;
  if (id === "sellQ"){ S.q = t.value; document.getElementById("sellList").innerHTML = sellList(); }
  else if (id === "invQ"){ S.iq = t.value; document.getElementById("groups").innerHTML = stockGroups(); }
  else if (id === "sheetPrice"){ S.price = t.value; var tot = 0; Object.keys(S.units).forEach(function(k){ tot += S.units[k]; }); document.getElementById("sheetTotal").textContent = fm0(tot * (parseFloat(t.value) || 0)); document.getElementById("sheetDes").textContent = desText(prod(S.sheet)); }
  else if (id === "docNo") S.docNo = t.value;
  else if (id === "docTotal"){ S.docTotal = t.value; document.getElementById("recvCheck").innerHTML = recvCheck(); }
  else if (id === "newName") S.newName = t.value;
  else if (id === "newPrice") S.newPrice = t.value;
  else if (id === "cName") S.cf.name = t.value;
  else if (id === "cPhone") S.cf.phone = t.value;
  else if (id === "cNote") S.cf.note = t.value;
  else if (id === "wT") S.wf.text = t.value;
  else if (id === "crA") S.crf.amount = t.value;
  else if (id === "crN") S.crf.note = t.value;
  else if (id === "custQ"){ S.cq = t.value; document.getElementById("custList").innerHTML = custList(); }
  else if (id === "closeTotal"){
    S.closeTotal = t.value; var tds = today(), sm = 0; M.forEach(function(m){ if (m.type === "sale" && m.date === tds) sm += m.price; });
    var dv = parseFloat(t.value); document.getElementById("closeDiff").innerHTML = closeDiff(isNaN(dv) ? null : Math.round((sm - dv) * 100) / 100);
  }
  else if (t.hasAttribute("data-cc")){
    var cp = t.getAttribute("data-cc"); S.cc[cp] = t.value;
    document.getElementById("cd-" + cp).innerHTML = closeInfo(stock(cp), t.value);
    document.getElementById("clSum").innerHTML = closeSummary();
  }
  else if (id === "clPaste") S.clPaste = t.value;
  else if (t.hasAttribute("data-dn")) desg(t.getAttribute("data-dn")).name = t.value;
  else if (t.hasAttribute("data-dm")){
    var dd = desg(t.getAttribute("data-dm")), mv = parseFloat(t.value);
    if (!isNaN(mv) && mv >= 1){ dd.mult = mv; document.getElementById("dx-" + dd.id).textContent = exampleTag(dd); }
  }
  else if (t.hasAttribute("data-count")){
    var pid = t.getAttribute("data-count"); S.counts[pid] = t.value;
    var diff = t.value === "" ? null : parseInt(t.value, 10) - stock(pid);
    document.getElementById("df-" + pid).innerHTML = diffPill(diff);
    var b = document.getElementById("applyBtn"); if (b) b.textContent = "עדכון הפרשים (" + countDiffs() + ")";
  }
});
document.addEventListener("change", function(ev){
  var id = ev.target.id;
  if (id === "recvD"){ S.rd = ev.target.value; S.rl = []; S.docNo = ""; S.docTotal = ""; render(); }
  else if (id === "clD"){ S.clD = ev.target.value; S.cc = {}; S.clMsg = ""; render(); }
  else if (ev.target.hasAttribute("data-dt")){ desg(ev.target.getAttribute("data-dt")).type = ev.target.value; render(); }
  else if (ev.target.hasAttribute("data-ds")){ desg(ev.target.getAttribute("data-ds")).scale = ev.target.value; toast("שיטת המידות עודכנה. מלאי קיים במידות מהשיטה הקודמת ממשיך להופיע."); render(); }
  else if (id === "repD"){ S.repD = ev.target.value; render(); }
  else if (id === "repM"){ S.repM = ev.target.value; render(); }
  else if (id === "wP") S.wf.p = ev.target.value;
  else if (id === "wS") S.wf.size = ev.target.value;
  else if (id === "saleCust") S.saleCust = ev.target.value;
  else if (id === "stuckX"){ S.X = parseInt(ev.target.value, 10); render(); }
  else if (id === "photoIn"){ var fl = ev.target.files[0]; if (fl) readPhoto(fl, function(url){ prod(S.sheet).img = url; renderSheet(); render(); }); }
});
document.addEventListener("toggle", function(ev){
  var t = ev.target;
  if (t.matches && t.matches("details[data-d]")) S.open[t.getAttribute("data-d")] = t.open;
}, true);
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape" && (S.sheet || S.cust)){ S.sheet = null; S.cust = null; renderSheet(); }
});

seed(); seedPeople();
render();
</script>
